    octx.fillRect(0,0,off.width,off.height);
    octx.drawImage(pc.bgCanvas, 0, 0);
    octx.drawImage(pc.canvas, 0, 0);
    const link = document.createElement('a');
    const title = (activeNotebook.pages[currentId].title || 'page').replace(/[^\w\- ]+/g,'').trim() || 'page';
    link.download = `${title}.png`;
    link.href = off.toDataURL('image/png');
    link.click();
  }

  function renderMorePanel(){
    const pages = activeNotebook.pageOrder.length;
    let thumbSrc = '';
    const pc = pageCanvases.get(currentId);
    try {
      if (pc){
        const off = document.createElement('canvas');
        off.width = pc.canvas.width; off.height = pc.canvas.height;
        const octx = off.getContext('2d');
        octx.drawImage(pc.bgCanvas, 0, 0);
        octx.drawImage(pc.canvas, 0, 0);
        thumbSrc = off.toDataURL('image/png');
      }
    } catch(e){ thumbSrc = ''; }
    const dps = data.settings.defaultPageSize || 'a4';
    morePanel.innerHTML = `
      <div class="moreHeader">
        ${thumbSrc ? `<img class="moreThumb" src="${thumbSrc}">` : `<div class="moreThumb"></div>`}
        <div class="moreInfo">
          <div class="n">${escapeHtml(activeNotebook.name)}</div>
          <div class="m">${pages} page${pages===1?'':'s'}<br>
            Last modified: ${fmtDate(activeNotebook.modifiedAt)}<br>
            Created at: ${fmtDate(activeNotebook.createdAt)}</div>
        </div>
      </div>
      <div class="tileRow">
        <button class="tile" id="tileExport">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 21h14"/></svg>
          <span>Export</span>
        </button>
        <button class="tile" id="tileRename">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
          <span>Rename</span>
        </button>
        <button class="tile" id="tileGoto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12h6M13 9l3 3-3 3"/></svg>
          <span>Go to page</span>
        </button>
        <button class="tile fav ${activeNotebook.favorite ? 'active' : ''}" id="tileFav">
          <svg viewBox="0 0 24 24" fill="${activeNotebook.favorite ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 9 22 9 16.5 13.5 18.5 21 12 16.5 5.5 21 7.5 13.5 2 9 9 9 12 2"/></svg>
          <span>Favorite</span>
        </button>
      </div>
      <div class="pDivider"></div>
      <div class="listRow" id="rowTemplate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="16" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
        Change template
      </div>
      <div class="listRow" id="rowStylus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        Stylus &amp; finger <span class="chev">›</span>
      </div>
      <div class="chipRow hidden" id="chipsStylus">
        <div class="radioPanel">
          <div class="radioGroupLabel">Single finger</div>
          <label class="radioOption"><input type="radio" name="singleFinger" value="ignored"><span>Ignored</span></label>
          <label class="radioOption"><input type="radio" name="singleFinger" value="draw"><span>Draw</span></label>
          <label class="radioOption"><input type="radio" name="singleFinger" value="scroll"><span>Scroll</span></label>
          <div class="radioGroupLabel" style="margin-top:10px;">Double finger</div>
          <label class="radioOption"><input type="radio" name="doubleFinger" value="ignored"><span>Ignored</span></label>
          <label class="radioOption"><input type="radio" name="doubleFinger" value="zoompan"><span>Zoom and pan</span></label>
          <label class="radioOption"><input type="radio" name="doubleFinger" value="scroll"><span>Scroll</span></label>
          ${zoomLocked ? '<div class="lockNote">Zoom is currently locked, therefore double finger input will be detected as scrolling instead.</div>' : ''}
        </div>
      </div>
      <div class="listRow" id="rowSettings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings <span class="chev">›</span>
      </div>
      <div class="chipRow hidden" id="chipsSettings">
        <div class="chip" data-v="palm">Palm rejection: ${data.settings.palmRejection ? 'On' : 'Off'}</div>
        <div class="fullRow">Default page size for new notebooks</div>
        <div class="chip pageSizeChip ${dps==='a4'?'active':''}" data-size="a4">A4</div>
        <div class="chip pageSizeChip ${dps==='letter'?'active':''}" data-size="letter">Letter</div>
        <div class="chip pageSizeChip ${dps==='square'?'active':''}" data-size="square">Square</div>
        <div class="chip pageSizeChip ${dps==='wide'?'active':''}" data-size="wide">Wide</div>
      </div>
    `;

    morePanel.querySelector('#tileExport').addEventListener('click', () => { exportCurrentPage(); morePanel.classList.add('hidden'); });
    morePanel.querySelector('#tileRename').addEventListener('click', async () => {
      morePanel.classList.add('hidden');
      const name = await customPrompt('Notebook name', activeNotebook.name);
      if (name && name.trim()){ activeNotebook.name = name.trim(); scheduleSave(); }
    });
    morePanel.querySelector('#tileGoto').addEventListener('click', () => { morePanel.classList.add('hidden'); openPagesModal(); });
    morePanel.querySelector('#tileFav').addEventListener('click', () => {
      activeNotebook.favorite = !activeNotebook.favorite;
      scheduleSave();
      renderMorePanel();
    });
    morePanel.querySelector('#rowTemplate').addEventListener('click', () => {
      morePanel.classList.add('hidden');
      openTemplateModal();
    });

    function wireExpand(rowId, chipsId){
      const row = morePanel.querySelector(rowId);
      const chips = morePanel.querySelector(chipsId);
      row.addEventListener('click', () => {
        const willOpen = chips.classList.contains('hidden');
        morePanel.querySelectorAll('.chipRow').forEach(c => c.classList.add('hidden'));
        morePanel.querySelectorAll('.listRow').forEach(r => r.classList.remove('open'));
        if (willOpen){ chips.classList.remove('hidden'); row.classList.add('open'); }
      });
      return { row, chips };
    }

    const stylusExpand = wireExpand('#rowStylus', '#chipsStylus');
    stylusExpand.chips.querySelector(`input[name="singleFinger"][value="${data.settings.singleFinger || 'draw'}"]`).checked = true;
    stylusExpand.chips.querySelector(`input[name="doubleFinger"][value="${data.settings.doubleFinger || 'zoompan'}"]`).checked = true;
    stylusExpand.chips.querySelectorAll('input[name="singleFinger"]').forEach(r => r.addEventListener('change', () => {
      data.settings.singleFinger = r.value; refreshTouchAction(); scheduleSave();
    }));
    stylusExpand.chips.querySelectorAll('input[name="doubleFinger"]').forEach(r => r.addEventListener('change', () => {
      data.settings.doubleFinger = r.value; scheduleSave();
    }));

    const settingsExpand = wireExpand('#rowSettings', '#chipsSettings');
    settingsExpand.chips.querySelectorAll('.chip[data-v]').forEach(chip => {
      chip.addEventListener('click', () => {
        if (chip.dataset.v === 'palm') data.settings.palmRejection = !data.settings.palmRejection;
        scheduleSave();
        renderMorePanel();
      });
    });
    settingsExpand.chips.querySelectorAll('.pageSizeChip').forEach(chip => {
      chip.addEventListener('click', () => {
        data.settings.defaultPageSize = chip.dataset.size;
        scheduleSave();
        renderMorePanel();
      });
    });
  }
  document.addEventListener('click', () => { recentPopover.classList.add('hidden'); morePanel.classList.add('hidden'); });

  // ---- Template modal ----
  const templateModal = document.getElementById('templateModal');
  let tmplState = null;
  const TMPL_COLORS = ['#ffffff', '#f6f3ec', '#e2c48f', '#cbd6ea', '#3a3f4a', '#111319'];
  function densityFromPx(px){ return Math.max(1, Math.min(9, Math.round((52 - px) / 3))); }
  function pxFromDensity(d){ return 52 - d * 3; }
  function styleThumbCss(v, bg){
    if (v === 'blank') return `background:${bg};`;
    if (v === 'ruled') return `background:repeating-linear-gradient(${bg}, ${bg} 6px, var(--paper-line) 7px);`;
    if (v === 'grid') return `background-color:${bg}; background-image:linear-gradient(var(--paper-line) 1px, transparent 1px), linear-gradient(90deg, var(--paper-line) 1px, transparent 1px); background-size:8px 8px;`;
    return `background-color:${bg}; background-image:radial-gradient(var(--paper-line) 1px, transparent 1.4px); background-size:8px 8px;`;
  }
  function openTemplateModal(){
    const eff = getEffectiveTemplateFor(activeNotebook.pages[currentId]);
    tmplState = { bgColor: eff.bgColor, template: eff.template, spacing: eff.spacing };
    document.getElementById('tmplSetDefault').checked = false;
    renderTemplateModal();
    templateModal.classList.remove('hidden');
  }
  function closeTemplateModal(){ templateModal.classList.add('hidden'); }
  function renderTemplateModal(){
    const swEl = document.getElementById('tmplSwatches');
    swEl.innerHTML = TMPL_COLORS.map(c => `<div class="tmplSwatch ${tmplState.bgColor===c?'active':''}" data-c="${c}" style="background:${c}"></div>`).join('');
    swEl.querySelectorAll('.tmplSwatch').forEach(sw => sw.addEventListener('click', () => { tmplState.bgColor = sw.dataset.c; renderTemplateModal(); }));

    document.getElementById('tmplDensity').value = densityFromPx(tmplState.spacing);
    document.getElementById('tmplDensityVal').textContent = densityFromPx(tmplState.spacing);

    const styles = [['blank','Blank'],['ruled','Rule'],['grid','Grid'],['dot','Dot']];
    const stEl = document.getElementById('tmplStyles');
    stEl.innerHTML = styles.map(([v,label]) => `
      <div class="tmplStyleCard ${tmplState.template===v?'active':''}" data-v="${v}">
        <div class="tmplStyleThumb" style="${styleThumbCss(v, tmplState.bgColor)}"></div>
        <div class="lbl">${label}</div>
      </div>`).join('');
    stEl.querySelectorAll('.tmplStyleCard').forEach(card => card.addEventListener('click', () => { tmplState.template = card.dataset.v; renderTemplateModal(); }));
  }
  document.getElementById('tmplDensity').addEventListener('input', (e) => {
    tmplState.spacing = pxFromDensity(parseInt(e.target.value));
    document.getElementById('tmplDensityVal').textContent = e.target.value;
    document.querySelectorAll('.tmplStyleThumb').forEach(el => { el.style.backgroundSize = `${tmplState.spacing}px ${tmplState.spacing}px`; });
  });
  document.getElementById('templateModalClose').addEventListener('click', closeTemplateModal);
  templateModal.addEventListener('click', (e) => { if (e.target === templateModal) closeTemplateModal(); });
  document.getElementById('tmplApplyCurrent').addEventListener('click', () => {
    const page = activeNotebook.pages[currentId];
    page.tmplOverride = { bgColor: tmplState.bgColor, template: tmplState.template, spacing: tmplState.spacing };
    if (document.getElementById('tmplSetDefault').checked){
      data.settings.defaultTemplate = { bgColor: tmplState.bgColor, template: tmplState.template, spacing: tmplState.spacing };
    }
    const pc = pageCanvases.get(currentId);
    if (pc) applyFrameBackground(pc.frame, page);
    scheduleSave();
    closeTemplateModal();
  });
  document.getElementById('tmplApplyAll').addEventListener('click', () => {
    activeNotebook.bgColor = tmplState.bgColor;
    activeNotebook.template = tmplState.template;
    activeNotebook.spacingPx = tmplState.spacing;
    activeNotebook.pageOrder.forEach(pid => {
      delete activeNotebook.pages[pid].tmplOverride;
      const pc = pageCanvases.get(pid);
      if (pc) applyFrameBackground(pc.frame, activeNotebook.pages[pid]);
    });
    if (document.getElementById('tmplSetDefault').checked){
      data.settings.defaultTemplate = { bgColor: tmplState.bgColor, template: tmplState.template, spacing: tmplState.spacing };
    }
    scheduleSave();
    closeTemplateModal();
  });

  window.addEventListener('resize', () => {
    const newDpr = Math.max(window.devicePixelRatio || 1, 1);
    if (newDpr !== dpr && activeNotebook){ dpr = newDpr; renderPageStack(); }
    if (activeNotebook && document.getElementById('editorView') && !document.getElementById('editorView').classList.contains('hidden')){
      // Was sitting at fit (e.g. hasn't manually zoomed in) — recompute fit for the new viewport
      // size (rotation, resize, keyboard opening, etc.) instead of leaving stale scale behind
      // that could overflow horizontally again.
      const wasAtFit = zoom <= fitZoom + 0.01;
      fitZoom = computeFitZoom();
      if (wasAtFit){ zoom = fitZoom; applyZoom(); }
      else { applyZoom(); }
    }
  });

  loadAll();
})();
</script>

<script>
  // ---- PWA: register service worker ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
