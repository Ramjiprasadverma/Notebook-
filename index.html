<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notebook — a notebook for your stylus</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#26314a">
<meta name="background-color" content="#26314a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notebook">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --paper: #f6f3ec;
    --paper-line: #d8d2c2;
    --ink: #1c2430;
    --ink-soft: #3a4354;
    --cover: #26314a;
    --cover-accent: #c9762f;
    --accent: #6b7fd7;
    --danger: #b4483a;
    --panel: #fbfaf6;
    --shadow: rgba(20, 24, 34, 0.18);
    --folder-tan: #e2c48f;
    --folder-tan-dark: #c9a468;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family: "Iowan Old Style","Georgia", serif;
    background: var(--cover);
    color: var(--ink);
  }
  button { font-family: inherit; }
  #app { display:flex; height:100%; width:100%; }

  /* ---- Tab rail (Home / Recently Deleted) ---- */
  #tabRail {
    width: 64px;
    background: linear-gradient(180deg, var(--cover), #1b2439);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 14px 0;
    gap: 14px;
    flex-shrink:0;
    z-index: 5;
    box-shadow: 2px 0 10px var(--shadow);
  }
  #tabRail .brand {
    color: var(--cover-accent);
    font-size: 11px;
    letter-spacing: 0.14em;
    writing-mode: vertical-rl;
    text-transform: uppercase;
    opacity: 0.85;
    font-family: "Times New Roman", serif;
    margin-bottom: 6px;
  }
  .tabBtn {
    width: 44px; height: 44px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.55);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tabBtn svg { width: 22px; height: 22px; }
  .tabBtn:hover { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.06); }
  .tabBtn.active { color: var(--cover-accent); background: rgba(201,118,47,0.14); }
  .tabSpacer { flex: 1; }
  .tabLabel {
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    text-align:center;
  }

  /* ---- Content area ---- */
  #content { flex:1; position:relative; overflow:hidden; background: var(--paper); }
  #browserView, #editorView { position:absolute; inset:0; display:flex; flex-direction:column; }
  .hidden { display:none !important; }

  #breadcrumb {
    display:flex; align-items:center; gap:6px;
    padding: 16px 24px 4px;
    font-size: 13px;
    color: #8a8474;
    flex-shrink:0;
  }
  #breadcrumb .crumb { cursor:pointer; }
  #breadcrumb .crumb:hover { color: var(--ink); text-decoration: underline; }
  #breadcrumb .crumb.current { color: var(--ink); font-weight:600; cursor:default; text-decoration:none; }
  #breadcrumb .sep { opacity: 0.5; }

  #browserHeader {
    display:flex; align-items:center; justify-content:space-between;
    padding: 4px 24px 14px;
    flex-shrink:0;
  }
  #browserHeader h1 { font-size: 22px; margin:0; font-weight:700; }
  #browserHeader p { margin: 2px 0 0; font-size: 12px; color: #8a8474; }

  #grid {
    flex:1;
    overflow-y:auto;
    padding: 4px 24px 32px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    align-content:start;
  }

  /* Folder card: literal manila-folder shape with a tab */
  .folderCard {
    position:relative;
    cursor:pointer;
    padding-top: 14px;
  }
  .folderCard .tabShape {
    width: 46%;
    height: 14px;
    background: var(--folder-tan-dark);
    border-radius: 6px 6px 0 0;
    margin-left: 10px;
  }
  .folderCard .body {
    background: var(--folder-tan);
    border-radius: 4px 10px 10px 10px;
    padding: 16px 14px;
    min-height: 84px;
    display:flex; flex-direction:column; justify-content:flex-end;
    box-shadow: 0 4px 10px var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .folderCard:hover .body { transform: translateY(-2px); box-shadow: 0 8px 16px var(--shadow); }
  .folderCard .name {
    font-weight:700; font-size:15px; color: #4a3a1e;
    outline:none;
  }
  .folderCard .count { font-size: 11px; color: #6b5a34; margin-top:2px; }
  .cardMenuBtn {
    position:absolute; top: -2px; right: -2px;
    width: 26px; height:26px; border-radius:999px;
    border:none; background: var(--panel); color:#6b6455;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow: 0 2px 6px var(--shadow);
  }
  .cardMenuBtn:hover { color: var(--ink); }

  /* Notebook card: cover with colored spine */
  .notebookCard { position:relative; cursor:pointer; }
  .notebookCard .cover {
    background: var(--panel);
    border-radius: 4px 8px 8px 4px;
    min-height: 100px;
    padding: 14px 14px 14px 18px;
    box-shadow: 0 4px 10px var(--shadow);
    border-left: 8px solid var(--spine, var(--accent));
    display:flex; flex-direction:column; justify-content:flex-end;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .notebookCard:hover .cover { transform: translateY(-2px); box-shadow: 0 8px 16px var(--shadow); }
  .notebookCard .name { font-weight:700; font-size:14px; color: var(--ink); }
  .notebookCard .count { font-size: 11px; color: #8a8474; margin-top:2px; }

  .addTile {
    border: 2px dashed var(--paper-line);
    border-radius: 10px;
    min-height: 84px;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    gap:4px;
    cursor:pointer;
    color: #a39c86;
    background:transparent;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .addTile:hover { border-color: var(--accent); color: var(--accent); }
  .addTile .plus { font-size: 24px; line-height:1; }
  .addTile span.label { font-size: 11px; }

  /* ---- Trash list ---- */
  #trashList { flex:1; overflow-y:auto; padding: 4px 24px 32px; display:flex; flex-direction:column; gap:10px; }
  .trashRow {
    display:flex; align-items:center; justify-content:space-between;
    background: var(--panel);
    border-radius: 10px;
    padding: 12px 16px;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .trashRow .info { display:flex; flex-direction:column; }
  .trashRow .info .n { font-weight:600; font-size:14px; }
  .trashRow .info .m { font-size: 11px; color:#8a8474; }
  .trashRow .actions { display:flex; gap:8px; }
  .trashBtn {
    border:none; border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer;
    font-family: inherit;
  }
  .trashBtn.restore { background: var(--accent); color:white; }
  .trashBtn.forever { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  #emptyState { padding: 40px 24px; text-align:center; color:#a39c86; font-size:13px; }

  /* ---- Editor (notebook open) — full-screen, single top toolbar ---- */
  #editorView { background: var(--paper); }
  #editorTopbar {
    display:flex; align-items:center; gap:2px;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--paper-line);
    flex-shrink:0;
    overflow-x:auto;
    scrollbar-width: none;
  }
  #editorTopbar::-webkit-scrollbar { display:none; }
  #toolOptionsRow {
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--paper-line);
    flex-shrink:0;
    overflow-x:auto;
    scrollbar-width: none;
  }
  #toolOptionsRow.hidden { display:none; }
  #toolOptionsRow::-webkit-scrollbar { display:none; }
  #arrowToggle svg { transition: transform 0.15s ease; }
  #arrowToggle.open svg { transform: rotate(180deg); }
  .ebtn {
    width:38px; height:38px; border-radius:8px; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color: var(--ink-soft); transition: background 0.15s ease, color 0.15s ease;
    flex-shrink:0; position:relative;
  }
  .ebtn:hover { background: rgba(107,127,215,0.12); }
  .ebtn.active { background: var(--accent); color:white; }
  .ebtn svg { width:19px; height:19px; }
  .ebtn:disabled { opacity: 0.35; cursor:default; }
  .ebtn:disabled:hover { background:transparent; }
  .ediv { width:1px; height:24px; background: var(--paper-line); margin:0 5px; flex-shrink:0; }
  .swatch { width:24px; height:24px; border-radius:999px; border:2px solid transparent; cursor:pointer; flex-shrink:0; }
  .swatchCustom { border-color: #d8d3c4; }
  .swatchCustom.active { border-color: var(--ink); transform: scale(1.08); }
  #toolOptionsRow .optLabel { font-size:11px; color:#8a8474; flex-shrink:0; }
  #toolOptionsRow .emptyNote { font-size:12px; color:#a39c86; padding:2px 0; }
  #clearPageBtn {
    flex-shrink:0; border:none; background:transparent; color:#b4483a; cursor:pointer;
    width:38px; height:38px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  }
  #clearPageBtn:hover { background: rgba(180,72,58,0.08); }
  .eraserSizeCircle {
    display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;
    width:40px; height:40px; border-radius:50%; border:2px solid transparent;
  }
  .eraserSizeCircle.active { border-color: var(--accent); }
  .eraserSizeCircle .swatchDot {
    border-radius:50%; border:1px solid #c9c2ae;
    background-image: repeating-conic-gradient(#d8d3c4 0% 25%, #efece2 0% 50%);
    background-size: 8px 8px;
  }
  .swatch.active { border-color: var(--ink); transform: scale(1.08); }
  #widthSlider { width:64px; accent-color: var(--accent); flex-shrink:0; }
  #pageTitle {
    font-size: 14px; font-weight:600; color: var(--ink);
    background:transparent; border:none; outline:none; font-family:inherit;
    width: 140px; flex-shrink:0; margin-left: 4px;
  }
  #topSpacer { flex:1; min-width: 8px; }

  /* Popovers (Recent notebooks / More menu) */
  .popover {
    position:fixed; background: var(--panel);
    border-radius: 12px; box-shadow: 0 10px 28px var(--shadow); border:1px solid var(--paper-line);
    z-index: 50; min-width: 220px; max-height: 70vh; overflow-y:auto;
  }
  .popover.hidden { display:none; }
  .popover .pRow {
    display:flex; align-items:center; gap:10px; padding: 10px 14px; cursor:pointer;
    font-size:13px; color: var(--ink);
  }
  .popover .pRow:hover { background: rgba(107,127,215,0.08); }
  .popover .pRow .sub { color:#8a8474; font-size:11px; }
  .popover .pHeader { padding: 12px 14px 6px; font-size:11px; color:#a39c86; text-transform:uppercase; letter-spacing:0.05em; }
  .popover .pDivider { height:1px; background: var(--paper-line); margin: 4px 0; }
  #morePanel { min-width: 280px; max-width: 300px; }
  #morePanel .moreHeader { display:flex; gap:12px; padding: 14px; }
  #morePanel .moreThumb {
    width: 52px; height: 68px; border-radius:4px; background: var(--panel);
    box-shadow: 0 2px 8px var(--shadow); object-fit: cover; flex-shrink:0;
    border: 1px solid var(--paper-line);
  }
  #morePanel .moreInfo .n { font-weight:700; font-size:14px; color: var(--ink); }
  #morePanel .moreInfo .m { font-size:10.5px; color:#8a8474; margin-top:2px; line-height:1.5; }
  #morePanel .tileRow { display:flex; gap:8px; padding: 4px 14px 12px; overflow-x:auto; }
  #morePanel .tile {
    flex-shrink:0; width: 72px; display:flex; flex-direction:column; align-items:center; gap:6px;
    background: rgba(107,127,215,0.1); border:none; border-radius:10px; padding: 10px 4px; cursor:pointer;
  }
  #morePanel .tile:hover { background: rgba(107,127,215,0.18); }
  #morePanel .tile svg { width:18px; height:18px; color: var(--accent); }
  #morePanel .tile.fav.active svg { color: #e0a12c; }
  #morePanel .tile span { font-size:10.5px; color: var(--ink-soft); }
  #morePanel .listRow {
    display:flex; align-items:center; gap:10px; padding: 11px 14px; cursor:pointer; font-size:13px; color:var(--ink);
  }
  #morePanel .listRow:hover { background: rgba(107,127,215,0.08); }
  #morePanel .listRow svg { width:17px; height:17px; color: var(--ink-soft); flex-shrink:0; }
  #morePanel .listRow .chev { margin-left:auto; color:#c9c2ac; transition: transform 0.15s ease; }
  #morePanel .listRow.open .chev { transform: rotate(90deg); }
  #morePanel .chipRow { display:flex; flex-wrap:wrap; gap:6px; padding: 0 14px 12px 41px; }
  #morePanel .chip {
    border:1px solid var(--paper-line); background: var(--panel); border-radius:999px;
    padding: 5px 12px; font-size:11.5px; cursor:pointer; color: var(--ink-soft);
  }
  #morePanel .chip.active { background: var(--accent); border-color: var(--accent); color:white; }
  #morePanel .fullRow { flex-basis:100%; font-size:10.5px; color:#8a8474; text-transform:uppercase; letter-spacing:0.05em; margin-top:6px; }
  #chipsStylus { padding: 0; display:block; }

  /* Favorite star on notebook cards */
  .notebookCard .favBadge { position:absolute; top:6px; right:6px; color:#e0a12c; font-size:13px; }

  /* Floating action button (New note / + menu) — shown on Home and inside any folder */
  #fab {
    position:absolute; right:22px; bottom:22px; z-index:15;
    display:flex; flex-direction:column; align-items:flex-end; gap:12px;
  }
  #fab.hidden { display:none; }
  #fabPlus {
    width:48px; height:48px; border-radius:999px; border:none; background: var(--panel); color: var(--ink);
    font-size:24px; line-height:1; box-shadow: 0 8px 20px var(--shadow); cursor:pointer;
  }
  #fabPlus:hover { background: rgba(107,127,215,0.1); }
  #fabNewNote {
    display:flex; align-items:center; gap:8px; border:none; border-radius:999px;
    background: var(--accent); color:white; padding: 14px 22px; font-size:14px; font-weight:700;
    cursor:pointer; box-shadow: 0 8px 20px var(--shadow); font-family:inherit;
  }
  #fabNewNote svg { width:16px; height:16px; }
  #fabMenu { position:absolute; bottom:60px; right:0; min-width: 170px; }

  /* All-pages grid modal */
  #pagesModal {
    position:absolute; inset:0; background: rgba(20,24,34,0.45);
    display:flex; align-items:center; justify-content:center; z-index:30;
  }
  #pagesModal.hidden { display:none; }
  #pagesModalCard {
    background: var(--paper); border-radius:14px; width: min(560px, 90vw); max-height: 78vh;
    display:flex; flex-direction:column; box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  #pagesModalHead { display:flex; align-items:center; justify-content:space-between; padding: 14px 18px; border-bottom:1px solid var(--paper-line); }
  #pagesModalHead h2 { font-size:16px; margin:0; }
  #pagesModalClose { border:none; background:transparent; cursor:pointer; color:#8a8474; font-size:18px; }

  /* Template modal */
  #templateModal {
    position:absolute; inset:0; background: rgba(20,24,34,0.45);
    display:flex; align-items:center; justify-content:center; z-index:35;
  }
  #templateModal.hidden { display:none; }
  #templateModalCard {
    background: var(--paper); border-radius:14px; width: min(420px, 90vw); max-height: 82vh;
    display:flex; flex-direction:column; box-shadow: 0 20px 50px rgba(0,0,0,0.35); overflow:hidden;
  }
  .modalHead { display:flex; align-items:center; justify-content:space-between; padding: 14px 18px; border-bottom:1px solid var(--paper-line); }
  .modalHead h2 { font-size:16px; margin:0; }
  .modalClose { border:none; background:transparent; cursor:pointer; color:#8a8474; font-size:18px; }
  .tmplBody { padding: 16px 18px; overflow-y:auto; flex:1; }
  .tmplSwatches { display:flex; gap:10px; margin-bottom:18px; }
  .tmplSwatch { width:32px; height:32px; border-radius:999px; border:2px solid var(--paper-line); cursor:pointer; flex-shrink:0; }
  .tmplSwatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(107,127,215,0.25); }
  .tmplSliderRow { display:flex; align-items:center; gap:10px; margin-bottom:18px; font-size:12px; color: var(--ink-soft); }
  .tmplSliderRow input[type=range] { flex:1; accent-color: var(--accent); }
  .tmplStyles { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
  .tmplStyleCard { cursor:pointer; text-align:center; }
  .tmplStyleThumb { aspect-ratio: 3/4; border-radius:6px; border:2px solid var(--paper-line); margin-bottom:6px; }
  .tmplStyleCard.active .tmplStyleThumb { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(107,127,215,0.2); }
  .tmplStyleCard .lbl { font-size:11px; color: var(--ink-soft); }
  .tmplFooter { padding: 14px 18px; border-top:1px solid var(--paper-line); }
  .tmplDefaultCheck { display:flex; align-items:center; gap:8px; font-size:12px; color: var(--ink-soft); margin-bottom:10px; }
  .tmplDefaultCheck input { accent-color: var(--accent); }
  .tmplBtnRow { display:flex; gap:8px; }
  .tmplBtn { flex:1; border:none; border-radius:8px; padding:11px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .tmplBtn.primary { background: var(--accent); color:white; }
  .tmplBtn.secondary { background: rgba(107,127,215,0.12); color: var(--accent); }

  /* Radio-style settings rows (single/double finger) */
  .radioPanel { padding: 0 14px 12px 41px; }
  .radioGroupLabel { font-size:10.5px; color:#8a8474; text-transform:uppercase; letter-spacing:0.05em; margin: 6px 0 4px; }
  .radioOption { display:flex; align-items:center; gap:8px; padding: 5px 0; font-size:13px; color: var(--ink); cursor:pointer; }
  .radioOption input { accent-color: var(--accent); width:15px; height:15px; }
  .lockNote { font-size:11px; color:#a39c86; margin-top:8px; line-height:1.4; }
  #pagesGrid { padding: 16px 18px; overflow-y:auto; display:grid; grid-template-columns: repeat(auto-fill, minmax(90px,1fr)); gap:12px; }
  .pageCard { position:relative; cursor:pointer; }
  .pageCard .thumb {
    background: var(--panel); border-radius:6px; aspect-ratio: 3/4;
    display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:#c9c2ac;
    border: 2px solid transparent; box-shadow: 0 2px 8px var(--shadow);
  }
  .pageCard.active .thumb { border-color: var(--cover-accent); color: var(--cover-accent); }
  .pageCard .label { font-size:11px; text-align:center; margin-top:4px; color:#8a8474; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pageCard .pageDelete {
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:999px;
    border:none; background:var(--panel); color:#8a8474; font-size:11px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; opacity:0; transition: opacity 0.15s ease;
    box-shadow: 0 2px 6px var(--shadow);
  }
  .pageCard:hover .pageDelete { opacity:1; }
  .pageCard .pageDelete:hover { color: var(--danger); }
  .pageCard.addTile .thumb { border: 2px dashed var(--paper-line); color:#a39c86; font-size:24px; box-shadow:none; background:transparent; }
  .pageCard.addTile:hover .thumb { border-color: var(--accent); color: var(--accent); }

  #editorBody { flex:1; position:relative; overflow:hidden; }
  #canvasWrap {
    position:absolute; inset:0; overflow:auto;
    background-color: #b9b2a0; /* "desk" area around pages, like a document canvas */
    -webkit-overflow-scrolling: touch;
  }
  #canvasStage {
    display:flex; flex-direction:column; align-items:center; gap:28px;
    width:100%; padding: 28px 16px 200px;
    /* Anchor scaling at top-center instead of the top-left corner. Since pages are already
       horizontally centered inside this full-width stage, scaling around its own horizontal
       center keeps them visually centered at any zoom level instead of drifting toward the
       left edge as soon as the scaled content is smaller than the viewport. */
    transform-origin: 50% 0;
  }
  .pageFrame {
    position:relative; flex-shrink:0; background:#fff;
    box-shadow: 0 4px 18px rgba(0,0,0,0.22);
  }
  .pageFrame::before {
    content:""; position:absolute; left: 40px; top:0; bottom:0; width:1px;
    background: rgba(180, 72, 58, 0.28); pointer-events:none; z-index:2;
  }
  .pageFrame.no-margin::before { display:none; }
  .pageFrame canvas { position:absolute; top:0; left:0; cursor:crosshair; }
  .pageFrame canvas.laserLayer { pointer-events:none; }

  /* Bottom-left status pill: page count / zoom / lock */
  #statusPill {
    position:absolute; left:14px; bottom:14px; z-index:6;
    display:flex; align-items:center; gap:10px;
    background: var(--panel); border-radius:999px; padding: 6px 10px;
    box-shadow: 0 6px 18px var(--shadow); border:1px solid var(--paper-line);
    font-size:11px; color:#8a8474;
  }
  #statusPill .sep { opacity:0.5; }
  #zoomBtn {
    border:none; background:transparent; cursor:pointer; font-size:11px; font-weight:600;

  #movePickerOverlay {

<script>
(function(){
  const SPINES = ['#6b7fd7', '#b4483a', '#2f7a4f', '#c9762f', '#8a5fb0', '#3a8fa0'];
  function uid(){ return 'i' + Math.random().toString(36).slice(2,9); }

  // ---- Data model ----
  // data.folders[id]    = { name, notebookIds:[] }
  // data.folderOrder    = [id...]
  // data.notebooks[id]  = { name, folderId, spine, pages:{id:{title,strokes,redo}}, pageOrder:[id...],
  //                          createdAt, modifiedAt, favorite, template:'ruled'|'grid'|'dot'|'blank', bgColor, spacingPx }
  // data.trash          = [ {trashId, type:'folder'|'notebook', deletedAt, data, folderName?} ... ]
  // data.settings        = { singleFinger:'ignored'|'draw'|'scroll', doubleFinger:'ignored'|'zoompan'|'scroll', palmRejection, defaultTemplate }
  // data.rootNotebookIds = [id...]  — notebooks that live directly on Home, not inside a folder
  let data = { folders:{}, folderOrder:[], notebooks:{}, trash:[], rootNotebookIds:[], settings:{ singleFinger:'draw', doubleFinger:'zoompan', palmRejection:true } };
  let nav = { tab:'home', folderId:null, notebookId:null };
  let activeNotebook = null;
  let currentId = null;

  function seedDefaults(){
    ['Accounting','Business Law','Economics','Maths'].forEach(name => {
      const id = uid();
      data.folders[id] = { name, notebookIds: [], parentFolderId: null };
      data.folderOrder.push(id);
    });
  }

  // Default page-size presets (CSS pixels, screen-proportionate — not print DPI)
  const PAGE_SIZES = {
    a4:     { name:'A4',     width: 827,  height: 1169 },
    letter: { name:'Letter', width: 850,  height: 1100 },
    square: { name:'Square', width: 900,  height: 900  },
    wide:   { name:'Wide',   width: 1200, height: 800  }
  };

  function newNotebookObj(name){
    const now = Date.now();
    const def = (data.settings && data.settings.defaultTemplate) || {};
    return { name, pages:{}, pageOrder:[], createdAt: now, modifiedAt: now, favorite:false,
      template: def.template || 'ruled', bgColor: def.bgColor || '#f6f3ec', spacingPx: def.spacing || 36,
      pageSize: (data.settings && data.settings.defaultPageSize) || 'a4' };
  }
  function newPageObj(bg){ return { title:'Untitled page', strokes:[], redo:[], bg: bg || null }; }

  async function importPdfAsNotebook(file){
    const overlay = document.getElementById('importOverlay');
    const msg = document.getElementById('importMsg');
    const targetFolderId = nav.folderId || null;
    const folder = targetFolderId ? data.folders[targetFolderId] : null;
    overlay.classList.remove('hidden');
    msg.textContent = 'Reading PDF…';
    try {
      if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions){
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      const buf = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
      const nbId = uid();
      const nb = newNotebookObj(file.name.replace(/\.pdf$/i, '') || 'Imported PDF');
      const siblingCount = folder ? folder.notebookIds.length : (data.rootNotebookIds || []).length;
      nb.spine = SPINES[siblingCount % SPINES.length];
      nb.folderId = targetFolderId;
      const maxWidth = 1100;
      for (let i = 1; i <= pdf.numPages; i++){
        msg.textContent = `Importing page ${i} of ${pdf.numPages}…`;
        const page = await pdf.getPage(i);
        const baseViewport = page.getViewport({ scale: 1 });
        const scale = Math.min(2, maxWidth / baseViewport.width);
        const viewport = page.getViewport({ scale });
        const off = document.createElement('canvas');
        off.width = viewport.width; off.height = viewport.height;
        const octx = off.getContext('2d');
        await page.render({ canvasContext: octx, viewport }).promise;
        const dataUrl = off.toDataURL('image/jpeg', 0.82);
        const pid = uid();
        nb.pages[pid] = newPageObj(dataUrl);
        nb.pages[pid].title = `Page ${i}`;
        nb.pages[pid].bgWidth = viewport.width;
        nb.pages[pid].bgHeight = viewport.height;
        nb.pageOrder.push(pid);
      }
      data.notebooks[nbId] = nb;
      if (folder) folder.notebookIds.push(nbId);
      else { if (!data.rootNotebookIds) data.rootNotebookIds = []; data.rootNotebookIds.push(nbId); }
      scheduleSave();
      renderBrowser();
    } catch(err){
      msg.textContent = 'Could not import that PDF.';
      await new Promise(r => setTimeout(r, 1400));
    } finally {
      overlay.classList.add('hidden');
    }
  }

  // ---- Persistence ----
  let saveTimer = null;
  async function loadAll(){
    try {
      const res = await window.storage.get('inkling-data-v2', false);
      if (res && res.value){
        const parsed = JSON.parse(res.value);
        data = Object.assign({folders:{}, folderOrder:[], notebooks:{}, trash:[], rootNotebookIds:[], settings:{singleFinger:'draw', doubleFinger:'zoompan', palmRejection:true}}, parsed);
        if (!data.rootNotebookIds) data.rootNotebookIds = [];
        if (!data.settings) data.settings = { singleFinger:'draw', doubleFinger:'zoompan', palmRejection:true };
        if (!data.settings.singleFinger) data.settings.singleFinger = 'draw';
        if (!data.settings.doubleFinger) data.settings.doubleFinger = 'zoompan';

  }
  function scheduleSave(){

    home.addEventListener('click', () => { nav.folderId = null; renderBrowser(); });
    bc.appendChild(home);
    // Walk up from the current folder to build the full ancestor chain (root first).
    const chain = [];
    let cur = nav.folderId;
    while (cur && data.folders[cur]){
      chain.unshift(cur);
      cur = data.folders[cur].parentFolderId || null;
    }
    chain.forEach((fid, i) => {
      const sep = document.createElement('span'); sep.className='sep'; sep.textContent = '›';
      bc.appendChild(sep);
      const f = document.createElement('span');
      f.className = 'crumb' + (i === chain.length - 1 ? ' current' : '');
      f.textContent = data.folders[fid].name;

  function serializeFolderTree(id){
    const folder = data.folders[id];
    const notebooks = folder.notebookIds.map(nid => data.notebooks[nid]).filter(Boolean);
    const children = data.folderOrder
      .filter(fid => data.folders[fid] && data.folders[fid].parentFolderId === id)
      .map(fid => serializeFolderTree(fid));
    return { name: folder.name, notebooks, children };
  }
  function collectFolderAndDescendantIds(id){
    let ids = [id];
    data.folderOrder.forEach(fid => {
      if (data.folders[fid] && data.folders[fid].parentFolderId === id){
        ids = ids.concat(collectFolderAndDescendantIds(fid));
      }
    });
    return ids;
  }
  function materializeFolderTree(tree, parentId){
    const id = uid();
    data.folders[id] = { name: tree.name, notebookIds: [], parentFolderId: parentId };
    data.folderOrder.push(id);
    (tree.notebooks || []).forEach(nb => {
      const nid = uid();
      nb.folderId = id;
      data.notebooks[nid] = nb;
      data.folders[id].notebookIds.push(nid);
    });
    (tree.children || []).forEach(childTree => materializeFolderTree(childTree, id));
    return id;
  }

  function deleteFolder(id){
    const folder = data.folders[id];
    if (!folder) return;
    data.trash.push({
      trashId: uid(), type:'folder', deletedAt: Date.now(),
      data: { name: folder.name },
      originalParentId: folder.parentFolderId || null,
      tree: serializeFolderTree(id)
    });
    const allIds = collectFolderAndDescendantIds(id);
    allIds.forEach(fid => {
      const f = data.folders[fid];
      if (f) f.notebookIds.forEach(nid => delete data.notebooks[nid]);
      delete data.folders[fid];
    });
    data.folderOrder = data.folderOrder.filter(fid => !allIds.includes(fid));
    if (allIds.includes(nav.folderId)) nav.folderId = folder.parentFolderId || null;
    scheduleSave();
    renderBrowser();
  }

  function deleteNotebook(id){
    const nb = data.notebooks[id];
    if (!nb) return;
    const folder = nav.folderId ? data.folders[nav.folderId] : null;
    data.trash.push({
      trashId: uid(), type:'notebook', deletedAt: Date.now(),
      data: nb, folderId: nav.folderId || null, folderName: folder ? folder.name : null,
      wasRoot: !nav.folderId
    });
    delete data.notebooks[id];
    if (folder) folder.notebookIds = folder.notebookIds.filter(n => n !== id);
    else data.rootNotebookIds = (data.rootNotebookIds || []).filter(n => n !== id);
    scheduleSave();
    renderBrowser();
  }

  // ---- Move: reassign a notebook or folder to a different parent folder (or Home) ----
  function moveNotebookToFolder(nbId, destFolderId){
    const nb = data.notebooks[nbId];
    if (!nb) return;
    const oldFolderId = nb.folderId || null;
    if (oldFolderId === (destFolderId || null)) return;
    if (oldFolderId && data.folders[oldFolderId]){
      data.folders[oldFolderId].notebookIds = data.folders[oldFolderId].notebookIds.filter(x => x !== nbId);
    } else {
      data.rootNotebookIds = (data.rootNotebookIds || []).filter(x => x !== nbId);
    }
    if (destFolderId && data.folders[destFolderId]){
      data.folders[destFolderId].notebookIds.push(nbId);
    } else {
      data.rootNotebookIds = data.rootNotebookIds || [];
      data.rootNotebookIds.push(nbId);
    }
    nb.folderId = destFolderId || null;
    scheduleSave();
    renderBrowser();
  }
  function moveFolderToParent(folderId, destParentId){
    const folder = data.folders[folderId];
    if (!folder || folder.parentFolderId === (destParentId || null)) return;
    folder.parentFolderId = destParentId || null;

    renderBrowser();
  }

  // ---- Move-to picker: a flat, indented list of Home + every valid destination folder ----
  function buildFolderOptions(excludeIds){

      data.folderOrder.forEach(fid => {
        const f = data.folders[fid];
        if (!f || f.parentFolderId !== parentId) return;
        if (excludeIds && excludeIds.has(fid)) return;
        options.push({ id: fid, label: f.name, depth });
        walk(fid, depth + 1);
      });
    })(null, 1);
    return options;
  }

  // ---- Share as PDF: rasterize every page (background + strokes) and assemble one PDF ----
  function loadImageAsync(src){
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(img);
      img.src = src;
    });
  }
  function getEffectiveTemplateForNb(nb, page){
    if (page.tmplOverride) return page.tmplOverride;
    return { bgColor: nb.bgColor || '#f6f3ec', template: nb.template || 'ruled', spacing: nb.spacingPx || 36 };
  }
  async function renderPageOffscreen(nb, page){
    const size = pageSizeFor(page, nb);
    const scale = 2;
    const bg = document.createElement('canvas');
    const ink = document.createElement('canvas');
    bg.width = ink.width = size.width * scale;
    bg.height = ink.height = size.height * scale;
    const bgCtx = bg.getContext('2d');
    const inkCtx = ink.getContext('2d');
    bgCtx.setTransform(scale, 0, 0, scale, 0, 0);
    inkCtx.setTransform(scale, 0, 0, scale, 0, 0);
    if (page.bg){
      const img = await loadImageAsync(page.bg);
      bgCtx.drawImage(img, 0, 0, size.width, size.height);
    } else {
      bgCtx.fillStyle = getEffectiveTemplateForNb(nb, page).bgColor || '#f6f3ec';
      bgCtx.fillRect(0, 0, size.width, size.height);
    }
    const imageSrcs = [...new Set(page.strokes.filter(s => s.tool === 'image').map(s => s.src))];
    for (const src of imageSrcs){
      const cached = imageObjCache.get(src);
      if (!cached || !cached.complete) imageObjCache.set(src, await loadImageAsync(src));
    }
    const lockedProtected = page.strokes.filter(s => (s.tool === 'image' || s.tool === 'table') && s.locked);
    for (const stroke of page.strokes){
      if (stroke.tool === 'eraser' && lockedProtected.length) eraseWithProtection(inkCtx, stroke, lockedProtected);
      else drawFullStroke(inkCtx, stroke, null);
    }
    const off = document.createElement('canvas');
    off.width = size.width * scale; off.height = size.height * scale;
    const octx = off.getContext('2d');
    octx.drawImage(bg, 0, 0);
    octx.drawImage(ink, 0, 0);
    return off.toDataURL('image/png');
  }
  let jsPDFLoadPromise = null;
  function ensureJsPDF(){
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
    if (jsPDFLoadPromise) return jsPDFLoadPromise;
    jsPDFLoadPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      script.onload = () => resolve();
      script.onerror = () => reject(new Error('load failed'));
      document.head.appendChild(script);
    });
    return jsPDFLoadPromise;
  }
  async function shareNotebookAsPDF(nbId){
    const nb = data.notebooks[nbId];
    if (!nb || !nb.pageOrder.length) return;
    try { await ensureJsPDF(); }
    catch(e){ await customConfirm('Could not load the PDF export library — check your internet connection and try again.'); return; }
    const { jsPDF } = window.jspdf;
    let doc = null;
    for (const pageId of nb.pageOrder){
      const page = nb.pages[pageId];
      if (!page) continue;
      const size = pageSizeFor(page, nb);
      const wCm = size.width / PX_PER_CM, hCm = size.height / PX_PER_CM;
      const dataUrl = await renderPageOffscreen(nb, page);
      if (!doc) doc = new jsPDF({ unit:'cm', format:[wCm, hCm] });
      else doc.addPage([wCm, hCm]);
      doc.addImage(dataUrl, 'PNG', 0, 0, wCm, hCm);
    }
    if (doc){
      const safeName = (nb.name || 'notebook').replace(/[^\w\- ]+/g,'').trim() || 'notebook';
      doc.save(`${safeName}.pdf`);
    }
  }

  function restoreEntry(trashId){
    const entry = data.trash.find(t => t.trashId === trashId);
    if (!entry) return;
    if (entry.type === 'folder'){
      if (entry.tree){
        // New nested format: rebuild the whole subtree, reattaching to its original parent if
        // that folder still exists, otherwise dropping it back at Home.
        const parentId = entry.originalParentId && data.folders[entry.originalParentId] ? entry.originalParentId : null;
        materializeFolderTree(entry.tree, parentId);
      } else {
        // Old flat format from before nested folders existed.
        const id = uid();
        data.folders[id] = { name: entry.data.name, notebookIds: [], parentFolderId: null };
        data.folderOrder.push(id);
        (entry.embeddedNotebooks || []).forEach(({nb}) => {
          const nid = uid();
          data.notebooks[nid] = nb;
          data.folders[id].notebookIds.push(nid);
        });
      }
    } else if (entry.wasRoot){
      const nid = uid();
      entry.data.folderId = null;
      data.notebooks[nid] = entry.data;
      if (!data.rootNotebookIds) data.rootNotebookIds = [];
      data.rootNotebookIds.push(nid);
    } else {
      let targetFolderId = entry.folderId && data.folders[entry.folderId] ? entry.folderId : null;
      if (!targetFolderId){
        // original folder is gone — restore into a catch-all "Restored" folder
        targetFolderId = data.folderOrder.find(fid => data.folders[fid].name === 'Restored');
        if (!targetFolderId){
          targetFolderId = uid();
          data.folders[targetFolderId] = { name: 'Restored', notebookIds: [], parentFolderId: null };
          data.folderOrder.push(targetFolderId);
        }
      }
      const nid = uid();
      data.notebooks[nid] = entry.data;
      data.folders[targetFolderId].notebookIds.push(nid);
    }
    data.trash = data.trash.filter(t => t.trashId !== trashId);
    scheduleSave();
    renderBrowser();
  }

  function escapeHtml(s){
    const d = document.createElement('div');

    return d.innerHTML;
  }

  // ---- Custom prompt/confirm modal — replaces window.prompt/confirm, which some embedded
  // webviews block outright or silently no-op on, making features that depend on them look broken. ----
  function showCustomModal({ message, defaultValue = '', isConfirm = false }){
    return new Promise((resolve) => {
      const overlay = document.getElementById('customPromptOverlay');
      const msgEl = document.getElementById('customPromptMessage');
      const inputEl = document.getElementById('customPromptInput');
      const okBtn = document.getElementById('customPromptOk');
      const cancelBtn = document.getElementById('customPromptCancel');
      msgEl.textContent = message;
      inputEl.style.display = isConfirm ? 'none' : 'block';
      inputEl.value = defaultValue;
      overlay.classList.remove('hidden');
      if (!isConfirm){ inputEl.focus(); inputEl.select(); }
      function cleanup(result){
        overlay.classList.add('hidden');
        okBtn.onclick = null; cancelBtn.onclick = null; inputEl.onkeydown = null;
        resolve(result);
      }
      okBtn.onclick = () => cleanup(isConfirm ? true : inputEl.value);
      cancelBtn.onclick = () => cleanup(isConfirm ? false : null);
      inputEl.onkeydown = (e) => {
        if (e.key === 'Enter'){ e.preventDefault(); cleanup(inputEl.value); }
        else if (e.key === 'Escape'){ e.preventDefault(); cleanup(isConfirm ? false : null); }
      };
    });
  }
  function customPrompt(message, defaultValue){ return showCustomModal({ message, defaultValue: defaultValue || '', isConfirm:false }); }
  function customConfirm(message){ return showCustomModal({ message, isConfirm:true }); }

  // A4 is defined as 827px for a real 21cm width, so that ratio is this app's px-per-cm baseline.
  const PX_PER_CM = 827 / 21;

  let drawing = false;
  let currentStroke = null;

  // ---- Page sizing: PDF-imported pages use their own natural size; regular pages use the notebook's page-size preset ----
  function pageSizeFor(page, notebook){
    if (page.bg && page.bgWidth && page.bgHeight) return { width: page.bgWidth, height: page.bgHeight };
    const preset = PAGE_SIZES[notebook.pageSize] || PAGE_SIZES.a4;
    return { width: preset.width, height: preset.height };
  }

  function mid(a,b){ return { x:(a.x+b.x)/2, y:(a.y+b.y)/2 }; }

  const TOOL_STYLE = {
    pen:         { widthMul: 1,   alpha: 1,    composite: 'source-over', pressureDamp: 0 },
    pencil:      { widthMul: 0.55,alpha: 0.85, composite: 'source-over', pressureDamp: 0.5 },
    highlighter: { widthMul: 3.2, alpha: 1,    composite: 'multiply',    pressureDamp: 1 },
    eraser:      { widthMul: 1,   alpha: 1,    composite: 'destination-out', pressureDamp: 0 },
    laser:       { widthMul: 1,   alpha: 0.9,  composite: 'source-over', pressureDamp: 1 }
  };

  // Shape tools draw a straight-edge primitive from the drag's start point to its current point,
  // instead of a freehand path — they don't use TOOL_STYLE (no pressure/tapering), so they fall
  // back to the plain pen look (solid ink, source-over) inside setupStrokeStyle.
  const SHAPE_TOOLS = new Set(['shapeLine', 'shapeRect', 'shapeCircle', 'shapeTriangle', 'shapeArrow']);

  // Tap tools stamp a single pre-configured object at the tapped point — no drag, no points array.
  // Drag tools (shapes + table + image) are all sized the same way: drag from a start corner to
  // wherever the pointer currently is, with a live full-redraw preview each move.
  const DRAG_TOOLS = new Set(['shapeLine', 'shapeRect', 'shapeCircle', 'table', 'image']);

  function effectivePressure(stroke, p){
    const s = TOOL_STYLE[stroke.tool] || TOOL_STYLE.pen;
    return s.pressureDamp ? (1 - s.pressureDamp) + p * s.pressureDamp * 0.6 + 0.4*s.pressureDamp : p;
  }
  function widthFor(stroke, p){
    const s = TOOL_STYLE[stroke.tool] || TOOL_STYLE.pen;
    return Math.max(stroke.width * s.widthMul * effectivePressure(stroke, p), 0.6);
  }
  function setupStrokeStyle(c, stroke){
    const s = TOOL_STYLE[stroke.tool] || TOOL_STYLE.pen;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.globalAlpha = s.alpha;
    if (stroke.tool === 'eraser'){
      c.globalCompositeOperation = 'destination-out';
      c.strokeStyle = 'rgba(0,0,0,1)';
      c.fillStyle = 'rgba(0,0,0,1)';
    } else if (stroke.tool === 'laser'){
      c.globalCompositeOperation = 'source-over';
      c.strokeStyle = '#ff3b30';
      c.fillStyle = '#ff3b30';
      c.shadowColor = '#ff3b30';
      c.shadowBlur = 8;
    } else {
      c.globalCompositeOperation = s.composite;
      c.strokeStyle = stroke.color;
      c.fillStyle = stroke.color;
      c.shadowBlur = 0;
    }
  }

  // Laser pointer: three passes (soft outer glow, brighter mid glow, hot white core) for a
  // neon-trail look instead of a plain thin line.
  function drawLaserSegment(c, stroke){
    const pts = stroke.points;
    const n = pts.length;
    const baseW = stroke.width || 6;
    c.save();
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.globalCompositeOperation = 'source-over';
    if (n < 2){
      const p = pts[0];
      c.shadowColor = '#ff3b30'; c.shadowBlur = 24;
      c.fillStyle = 'rgba(255,59,48,0.55)';
      c.beginPath(); c.arc(p.x, p.y, baseW * 1.1, 0, Math.PI*2); c.fill();
      c.shadowBlur = 6;
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(p.x, p.y, Math.max(1, baseW * 0.35), 0, Math.PI*2); c.fill();
      c.restore();
      return;
    }
    let start, end, midp;
    if (n === 2){ start = pts[0]; end = pts[1]; }
    else { const p1 = pts[n-3], p2 = pts[n-2], p3 = pts[n-1]; start = mid(p1,p2); end = mid(p2,p3); midp = p2; }
    const tracePath = () => {
      c.beginPath();
      c.moveTo(start.x, start.y);
      if (midp) c.quadraticCurveTo(midp.x, midp.y, end.x, end.y);
      else c.lineTo(end.x, end.y);
    };
    c.shadowColor = '#ff3b30';
    c.shadowBlur = 26; c.strokeStyle = 'rgba(255,59,48,0.5)'; c.lineWidth = baseW * 2.4;
    tracePath(); c.stroke();
    c.shadowBlur = 13; c.strokeStyle = 'rgba(255,59,48,0.9)'; c.lineWidth = baseW * 1.2;
    tracePath(); c.stroke();
    c.shadowBlur = 4; c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = Math.max(1, baseW * 0.35);
    tracePath(); c.stroke();
    c.restore();
  }

  function drawIncrementalSegment(c, stroke){
    if (stroke.tool === 'laser'){ drawLaserSegment(c, stroke); return; }
    if (stroke.tool === 'eraser' && activePageId && activeNotebook){
      const page = activeNotebook.pages[activePageId];
      const locked = page ? page.strokes.filter(s => (s.tool === 'image' || s.tool === 'table') && s.locked) : [];
      if (locked.length){
        const pts = stroke.points, recent = pts.slice(-3);
        let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
        recent.forEach(p => { minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); });
        const pad = (stroke.width || 10) + 4;
        minX-=pad; minY-=pad; maxX+=pad; maxY+=pad;
        const overlapping = locked.filter(s => {
          const b = strokeRectBounds(s);
          return !(b.x2 < minX || b.x1 > maxX || b.y2 < minY || b.y1 > maxY);
        });
        if (overlapping.length){
          const t = c.getTransform();
          const snapshots = [];
          overlapping.forEach(s => {
            const b = strokeRectBounds(s);
            const ix1 = Math.max(b.x1, minX), iy1 = Math.max(b.y1, minY);
            const ix2 = Math.min(b.x2, maxX), iy2 = Math.min(b.y2, maxY);
            if (ix2 <= ix1 || iy2 <= iy1) return;
            const dx = Math.round(ix1*t.a + t.e), dy = Math.round(iy1*t.d + t.f);
            const dw = Math.round((ix2-ix1)*t.a), dh = Math.round((iy2-iy1)*t.d);
            if (dw <= 0 || dh <= 0) return;
            try { snapshots.push({ x: dx, y: dy, data: c.getImageData(dx, dy, dw, dh) }); }
            catch(e){}
          });
          drawIncrementalSegmentInner(c, stroke);
          snapshots.forEach(snap => c.putImageData(snap.data, snap.x, snap.y));
          return;
        }
      }
    }
    drawIncrementalSegmentInner(c, stroke);
  }
  function drawIncrementalSegmentInner(c, stroke){
    const pts = stroke.points;
    const n = pts.length;
    setupStrokeStyle(c, stroke);
    if (n === 1){
      const p = pts[0];
      c.beginPath();
      c.arc(p.x, p.y, widthFor(stroke, p.pressure)/2, 0, Math.PI*2);
      c.fill();
      return;
    }
    if (n === 2){
      const p0 = pts[0], p1 = pts[1];
      c.beginPath();
      c.lineWidth = widthFor(stroke, p1.pressure);
      c.moveTo(p0.x, p0.y);
      c.lineTo(p1.x, p1.y);
      c.stroke();
      return;
    }
    const p1 = pts[n-3], p2 = pts[n-2], p3 = pts[n-1];
    const start = mid(p1, p2);
    const end = mid(p2, p3);
    c.beginPath();
    c.lineWidth = widthFor(stroke, p2.pressure);
    c.moveTo(start.x, start.y);
    c.quadraticCurveTo(p2.x, p2.y, end.x, end.y);
    c.stroke();
    c.globalAlpha = 1; c.shadowBlur = 0;
  }

  function drawShapeStroke(c, stroke){
    setupStrokeStyle(c, stroke);
    c.lineWidth = stroke.width;
    c.beginPath();
    if (stroke.tool === 'shapeRect'){
      const x = Math.min(stroke.x1, stroke.x2), y = Math.min(stroke.y1, stroke.y2);
      const w = Math.abs(stroke.x2 - stroke.x1), h = Math.abs(stroke.y2 - stroke.y1);
      c.rect(x, y, w, h);
    } else if (stroke.tool === 'shapeCircle'){
      const cx = (stroke.x1 + stroke.x2) / 2, cy = (stroke.y1 + stroke.y2) / 2;
      const rx = Math.abs(stroke.x2 - stroke.x1) / 2, ry = Math.abs(stroke.y2 - stroke.y1) / 2;
      c.ellipse(cx, cy, Math.max(rx, 0.01), Math.max(ry, 0.01), 0, 0, Math.PI * 2);
    } else if (stroke.tool === 'shapeTriangle'){
      const x1 = Math.min(stroke.x1, stroke.x2), x2 = Math.max(stroke.x1, stroke.x2);
      const y1 = Math.min(stroke.y1, stroke.y2), y2 = Math.max(stroke.y1, stroke.y2);
      c.moveTo((x1 + x2) / 2, y1);
      c.lineTo(x2, y2);
      c.lineTo(x1, y2);
      c.closePath();
    } else if (stroke.tool === 'shapeArrow'){
      const dx = stroke.x2 - stroke.x1, dy = stroke.y2 - stroke.y1;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const headLen = Math.max(10, stroke.width * 3);
      const angle = Math.PI / 7;
      c.moveTo(stroke.x1, stroke.y1);
      c.lineTo(stroke.x2, stroke.y2);
      const cos1 = Math.cos(angle), sin1 = Math.sin(angle);
      const cos2 = Math.cos(-angle), sin2 = Math.sin(-angle);
      c.moveTo(stroke.x2, stroke.y2);
      c.lineTo(stroke.x2 - headLen * (ux * cos1 - uy * sin1), stroke.y2 - headLen * (uy * cos1 + ux * sin1));
      c.moveTo(stroke.x2, stroke.y2);
      c.lineTo(stroke.x2 - headLen * (ux * cos2 - uy * sin2), stroke.y2 - headLen * (uy * cos2 + ux * sin2));
    } else {
      c.moveTo(stroke.x1, stroke.y1);
      c.lineTo(stroke.x2, stroke.y2);
    }
    c.stroke();
    c.globalAlpha = 1; c.shadowBlur = 0;
  }

  function drawTextStroke(c, stroke){
    c.save();
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.shadowBlur = 0;
    c.fillStyle = stroke.color;
    c.font = `${stroke.fontSize || 22}px Georgia, "Iowan Old Style", serif`;
    c.textBaseline = 'top';
    c.fillText(stroke.text, stroke.x, stroke.y);
    c.restore();
  }

  function drawLockBadge(c, stroke){
    if (!stroke.locked) return;
    const x = Math.min(stroke.x1, stroke.x2), y = Math.min(stroke.y1, stroke.y2);
    c.save();
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.shadowBlur = 0;
    const bx = x + 6, by = y + 6;
    c.fillStyle = 'rgba(138,109,59,0.9)';
    c.beginPath();
    c.roundRect ? c.roundRect(bx, by, 22, 20, 5) : c.rect(bx, by, 22, 20);
    c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 1.6; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    c.rect(bx + 5, by + 10, 12, 8);
    c.stroke();
    c.beginPath();
    c.arc(bx + 11, by + 10, 4.5, Math.PI, 0);
    c.stroke();
    c.restore();
  }
  function drawTableStroke(c, stroke){
    c.save();
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.shadowBlur = 0;
    c.strokeStyle = stroke.color; c.lineWidth = stroke.width || 1.5; c.lineCap = 'butt'; c.lineJoin = 'miter';
    const x = Math.min(stroke.x1, stroke.x2), y = Math.min(stroke.y1, stroke.y2);
    const w = Math.abs(stroke.x2 - stroke.x1), h = Math.abs(stroke.y2 - stroke.y1);
    const rows = stroke.rows || 3, cols = stroke.cols || 3;
    c.strokeRect(x, y, w, h);
    for (let i=1; i<rows; i++){
      const ry = y + (h/rows)*i;
      c.beginPath(); c.moveTo(x, ry); c.lineTo(x+w, ry); c.stroke();
    }
    for (let j=1; j<cols; j++){
      const rx = x + (w/cols)*j;
      c.beginPath(); c.moveTo(rx, y); c.lineTo(rx, y+h); c.stroke();
    }
    c.restore();
    drawLockBadge(c, stroke);
  }

  const imageObjCache = new Map();
  function drawImageStroke(c, stroke, pageId){
    let img = imageObjCache.get(stroke.src);
    if (!img){
      img = new Image();
      imageObjCache.set(stroke.src, img);
      img.onload = () => { if (pageId) redrawPage(pageId); };
      img.src = stroke.src;
      return; // will repaint once loaded
    }
    if (!img.complete) return;
    const x = Math.min(stroke.x1, stroke.x2), y = Math.min(stroke.y1, stroke.y2);
    const w = Math.abs(stroke.x2 - stroke.x1), h = Math.abs(stroke.y2 - stroke.y1);
    c.save();
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.shadowBlur = 0;
    if (stroke.cropRect){
      const cr = stroke.cropRect;
      c.drawImage(img, cr.sx, cr.sy, cr.sw, cr.sh, x, y, w, h);
    } else {
      c.drawImage(img, x, y, w, h);
    }
    c.restore();
    drawLockBadge(c, stroke);
  }

  function drawFullStroke(c, stroke, pageId){
    if (SHAPE_TOOLS.has(stroke.tool)){ drawShapeStroke(c, stroke); return; }
    if (stroke.tool === 'text'){ drawTextStroke(c, stroke); return; }
    if (stroke.tool === 'table'){ drawTableStroke(c, stroke); return; }
    if (stroke.tool === 'image'){ drawImageStroke(c, stroke, pageId); return; }
    const pts = stroke.points;
    if (pts.length < 1) return;
    setupStrokeStyle(c, stroke);
    if (pts.length === 1){
      const p = pts[0];
      c.beginPath();
      c.arc(p.x, p.y, widthFor(stroke, p.pressure)/2, 0, Math.PI*2);
      c.fill();
      c.globalAlpha = 1; c.shadowBlur = 0;
      return;
    }
    if (pts.length === 2){
      c.beginPath();
      c.lineWidth = widthFor(stroke, pts[1].pressure);
      c.moveTo(pts[0].x, pts[0].y);
      c.lineTo(pts[1].x, pts[1].y);
      c.stroke();
      c.globalAlpha = 1; c.shadowBlur = 0;
      return;
    }
    for (let i=2; i<pts.length; i++){
      const p1 = pts[i-2], p2 = pts[i-1], p3 = pts[i];
      const start = mid(p1, p2);
      const end = mid(p2, p3);
      c.beginPath();
      c.lineWidth = widthFor(stroke, p2.pressure);
      c.moveTo(start.x, start.y);
      c.quadraticCurveTo(p2.x, p2.y, end.x, end.y);
      c.stroke();
    }
    const last3 = pts.slice(-3);
    const lastMid = mid(last3[0], last3[1]);
    c.beginPath();
    c.lineWidth = widthFor(stroke, pts[pts.length-1].pressure);
    c.moveTo(lastMid.x, lastMid.y);
    c.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
    c.stroke();
    c.globalAlpha = 1; c.shadowBlur = 0;
  }

  const bgImageCache = new Map();
  function drawBgImage(ctxEl, canvasEl, page, pageId){
    if (!page.bg) return;
    let img = bgImageCache.get(page.bg);
    if (!img){
      img = new Image();
      img.onload = () => { bgImageCache.set(page.bg, img); redrawPageBg(pageId); };
      img.src = page.bg;
      return;
    }
    const w = parseFloat(canvasEl.style.width) || 0;
    const h = parseFloat(canvasEl.style.height) || 0;
    ctxEl.drawImage(img, 0, 0, w, h);
  }
  function redrawPageBg(pageId){
    const pc = pageCanvases.get(pageId);
    if (!pc || !activeNotebook) return;
    const page = activeNotebook.pages[pageId];
    if (!page) return;
    pc.bgCtx.clearRect(0, 0, pc.bgCanvas.width, pc.bgCanvas.height);
    drawBgImage(pc.bgCtx, pc.bgCanvas, page, pageId);
  }

  function strokeRectBounds(s){
    return {
      x1: Math.min(s.x1, s.x2), y1: Math.min(s.y1, s.y2),
      x2: Math.max(s.x1, s.x2), y2: Math.max(s.y1, s.y2)
    };
  }
  function eraseWithProtection(c, stroke, lockedStrokes){
    const pts = stroke.points;
    if (!pts || !pts.length) return;
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    pts.forEach(p => { minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); });
    const pad = (stroke.width || 10) + 4;
    minX-=pad; minY-=pad; maxX+=pad; maxY+=pad;

    if (eff.template === 'grid'){

      frame.style.backgroundSize = `${spacing}px ${spacing}px`;
